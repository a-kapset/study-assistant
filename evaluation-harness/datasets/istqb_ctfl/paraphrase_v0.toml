# Paraphrase pairs v0 of the first course: every answerable question of Q&A set v1, reworded the way a learner asks
# who does not know the course's term yet. A rewording keeps the meaning and the gold section of its question and
# leaves out every key term of the question; the run refuses a pair whose rewording still contains one. Like the
# Q&A set, the rewordings were written for this set and may be public.
#
# Check that no question or rewording copies a held-out question of the local question bank:
#     poetry run python -m evalharness.datasets.check_paraphrases datasets/istqb_ctfl/paraphrase_v0.toml datasets/istqb_ctfl/retrieval_gold_v0.toml
# Run the relation on the stack with the course ingested:
#     poetry run python -m evalharness.evaluation.paraphrase_run datasets/istqb_ctfl/paraphrase_v0.toml
#
# The rewordings were written before the first run and not changed by looking at search results.

course_id = "istqb_ctfl"
# The Q&A set the pairs come from, next to this file; a pair names its question by the case id.
qa_file = "qa_v1.toml"

# How the two relations are judged, fixed before the first run (2026-11-07).
[relations]
# Answer kept: the change of recall from the questions to their rewordings, judged by its 95 % interval. A change
# smaller than this is not worth acting on: the same value as for two retrieval runs of the course, about 4 of the
# 82 pairs.
min_meaningful_change = 0.05
# Top-k stable: a pair counts as stable when its two searches share at least this part of their k passages
# (3 of 5). The answer step reads these passages, so with fewer than 3 shared most of what it reads changes.
min_overlap = 0.6
# Share of stable pairs the search must reach, judged by the lower end of its interval. Rewording without the term
# is a hard change, so most pairs, not all, are expected to stay stable.
stable_share_min = 0.7

