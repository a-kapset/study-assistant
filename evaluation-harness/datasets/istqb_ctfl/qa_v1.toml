# Q&A set v1 of the first course: questions a learner could ask in the "study / ask" mode, each with the course
# section that answers it, and questions the course does not answer. The questions were written for this set (not
# taken from exams or course materials, which a model may have seen in training), so the file may be public; the
# answers the app gives quote the course and stay on the local machine.
#
# v1 keeps the 30 questions of v0 with their ids and adds about one question for every learning objective of the
# syllabus that v0 left out, and 20 more unanswerable questions, so that a share can be read against its target.
# Every question lists the words it turns on (key_terms). Check the set against the stored course with
#     poetry run python -m evalharness.datasets.check_qa_set datasets/istqb_ctfl/qa_v1.toml
# For an answerable question each key term occurs in a passage of its gold section; for an unanswerable one no key
# term occurs in any passage of the course (syllabus and Stapp et al. Part II). The course mentions nearby topics,
# so search may still find passages, and the model has to see that they do not answer. Whether a passage really
# answers a question is the writer's judgement; the check only rules out a wrong section or a covered topic.
# The questions were not chosen or changed by looking at search or answer results.

course_id = "istqb_ctfl"

# What the run reports and which results count as good enough, fixed before the first run of v1. With about 80
# answerable questions a share is precise to about +-8 points, so a share of about 0.95 can show that it reaches
# 0.85 by the lower end of its interval.
[targets]
# Share of answerable questions the app answers instead of declining. Search alone loses about one question in
# twelve under the lowest score (retrieval recall@5 0.918), so a perfect value is not expected.
answered_min = 0.85
# Share of answered answerable questions whose citations include a passage of the gold section or a subsection.
gold_cited_min = 0.75
# Unanswerable questions the app answers instead of declining. An answer without support in the course is a
# blocker whatever the other numbers are.
unsupported_answers_max = 0

# Answerable: gold_section is the second-level section that answers the question; a citation of that section or
# of one of its subsections counts.

