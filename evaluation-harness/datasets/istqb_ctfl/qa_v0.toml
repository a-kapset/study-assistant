# Q&A set v0 of the first course: questions a learner could ask in the "study / ask" mode, each with the course
# section that answers it, and questions the course does not answer. The questions were written for this set (not
# taken from exams or course materials), so the file may be public; the answers the app gives quote the course and
# stay on the local machine.
#
# Gold sections were checked against the stored passages of the course on 2026-11-03: the key term of every
# answerable question occurs in the syllabus passages of its section. For every unanswerable question the key
# terms occur in no passage of the course (syllabus and Stapp et al. Part II); the course does mention nearby
# topics, so search may still find passages, and the model has to see that they do not answer.
# The questions were not chosen or changed by looking at search or answer results.

course_id = "istqb_ctfl"

# What the run reports and which results count as good enough, fixed before the first run. With 20 and 10 cases
# a rate is precise only to about +-20 points, so the targets are round values that tell a working answer step
# from a broken one, not small differences.
[targets]
# Share of answerable questions the app answers instead of declining. Search alone already loses about one
# question in twelve under the lowest score (retrieval recall@5 0.918), so a perfect value is not expected.
answered_min = 0.85
# Share of answered answerable questions whose citations include a passage of the gold section or a subsection.
gold_cited_min = 0.75
# Unanswerable questions the app answers instead of declining. An answer without support in the course is a
# blocker whatever the other numbers are.
unsupported_answers_max = 0

