# Local stack: PostgreSQL with pgvector, the embedding server (after a check of its model files), a one-shot
# migration run, the app, then a one-shot ingestion run that brings every course's stored data in line with its files.
# Every value comes from the .env file next to this one (see .env.example); a missing one stops Compose
# with its name. Each service gets only the values it needs.
name: study-assistant

# The migration run and the app use the same image; both services build it from the same place.
x-app-build: &app-build
  context: ./app
  args:
    GIT_COMMIT: ${GIT_COMMIT:?set GIT_COMMIT in .env, see .env.example}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env, see .env.example}
      # The database owner: a superuser that only the migration run connects as.
      POSTGRES_USER: ${DB_OWNER:?set DB_OWNER in .env, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env, see .env.example}
    networks:
      default:
        # The app and the migration run reach the database by this name.
        aliases: ["${DB_HOST:?set DB_HOST in .env, see .env.example}"]
    volumes:
      # The data lives in the named volume, not in the container: stopping, removing or rebuilding containers keeps
      # it; only "docker compose down -v" deletes it. PostgreSQL 18 images keep their data under this directory.
      - db-data:/var/lib/postgresql
    healthcheck:
      # $$ passes the variable to the container's shell instead of Compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      # Reachable from this machine only, for checks that read the stored data with the read-only role.
      - "127.0.0.1:${DB_PUBLISHED_PORT:?set DB_PUBLISHED_PORT in .env, see .env.example}:5432"

  migrate:
    build: *app-build
    # Runs once as the database owner, then exits; the app waits for it. It changes the tables, not the course data in them:
    # 1. applies the files in app/src/study_assistant/migrations/ the database has not seen yet, in order; the
    #    applied ones are listed in the table schema_migrations, which lives in the same volume as the data;
    # 2. prepares the configured embedding space: a new one gets a registry row and an empty vector table with its
    #    index (ingestion fills it); a known one is left as it is; a known one with another vector length stops;
    # 3. prepares two login roles: the app's (reads and writes rows, cannot change tables) and a read-only one.
    command: ["python", "-m", "study_assistant.migrate"]
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:?set APP_LOG_LEVEL in .env, see .env.example}
      APP_DB__HOST: ${DB_HOST}
      APP_DB__PORT: ${DB_PORT:?set DB_PORT in .env, see .env.example}
      APP_DB__NAME: ${DB_NAME}
      APP_DB__CONNECT_TIMEOUT_S: ${DB_CONNECT_TIMEOUT_S:?set DB_CONNECT_TIMEOUT_S in .env, see .env.example}
      APP_DB__USER: ${DB_OWNER}
      APP_DB__PASSWORD: ${DB_PASSWORD}
      APP_SERVER_ROLE__NAME: ${DB_APP_USER:?set DB_APP_USER in .env, see .env.example}
      APP_SERVER_ROLE__PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env, see .env.example}
      APP_READER_ROLE__NAME: ${DB_READER_USER:?set DB_READER_USER in .env, see .env.example}
      APP_READER_ROLE__PASSWORD: ${DB_READER_PASSWORD:?set DB_READER_PASSWORD in .env, see .env.example}
      # The embedding space whose vector table this run prepares.
      APP_EMBEDDING__MODEL: ${APP_EMBEDDING__MODEL:?set APP_EMBEDDING__MODEL in .env, see .env.example}
      APP_EMBEDDING__REVISION: ${APP_EMBEDDING__REVISION:?set APP_EMBEDDING__REVISION in .env, see .env.example}
      APP_EMBEDDING__DIMENSION: ${APP_EMBEDDING__DIMENSION:?set APP_EMBEDDING__DIMENSION in .env, see .env.example}
      APP_EMBEDDING__PASSAGE_PREFIX: ${APP_EMBEDDING__PASSAGE_PREFIX:?set APP_EMBEDDING__PASSAGE_PREFIX in .env, see .env.example}
      APP_EMBEDDING__QUERY_PREFIX: ${APP_EMBEDDING__QUERY_PREFIX:?set APP_EMBEDDING__QUERY_PREFIX in .env, see .env.example}
    depends_on:
      db:
        condition: service_healthy

  # Checks the model files before the embedding server may read them. The expected SHA-256 of every file the server
  # needs is committed in models.sha256, so a missing, damaged or different file is named here and the server never
  # starts with it. Runs once and exits, like the migration run; no network is needed.
  model-check:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    working_dir: /model
    # The list starts with comment lines, which sha256sum cannot skip, so they are filtered out first. An empty list
    # still fails ("no checksum lines found"), so a list with only comments cannot pass.
    command: ["sh", "-c", "grep -v '^#' /hashes/models.sha256 | sha256sum -c -"]
    network_mode: none
    volumes:
      # The folder is named after the configured model and revision, so a revision changed in .env without its
      # files fails here instead of serving the old model under the new name.
      - ./models/${APP_EMBEDDING__MODEL}/${APP_EMBEDDING__REVISION}:/model:ro
      - ./models.sha256:/hashes/models.sha256:ro

  # The embedding server: runs the model and turns texts into vectors for the app (Hugging Face Text Embeddings
  # Inference). The image is pinned by digest, so an upgrade is a deliberate change that the vector reference
  # check has to pass.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    # Serves the model from the checked folder. Because onnx/model.onnx is there, the server runs it on the ONNX
    # Runtime backend; without that file it would quietly switch to another backend with slightly different vectors.
    command: ["--model-id", "/data/model"]
    environment:
      # Never download anything: the server reads only the files that model-check has just checked.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models/${APP_EMBEDDING__MODEL}/${APP_EMBEDDING__REVISION}:/data/model:ro
    ports:
      # Reachable from this machine only, for checks that compare the server's vectors with reference vectors.
      - "127.0.0.1:${EMBEDDER_PUBLISHED_PORT:?set EMBEDDER_PUBLISHED_PORT in .env, see .env.example}:80"
    depends_on:
      # Starts only when every model file matched its committed hash.
      model-check:
        condition: service_completed_successfully
    healthcheck:
      # Healthy once the model is loaded and the server answers; loading takes a few seconds.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: *app-build
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL}
      APP_DB__HOST: ${DB_HOST}
      APP_DB__PORT: ${DB_PORT}
      APP_DB__NAME: ${DB_NAME}
      APP_DB__CONNECT_TIMEOUT_S: ${DB_CONNECT_TIMEOUT_S}
      # Row access only: the app cannot change the schema and never gets the owner's password.
      APP_DB__USER: ${DB_APP_USER}
      APP_DB__PASSWORD: ${DB_APP_PASSWORD}
      APP_COURSES__MANIFEST_DIR: ${COURSES_DIR:?set COURSES_DIR in .env, see .env.example}
      APP_COURSES__ENABLED: ${APP_COURSES__ENABLED:?set APP_COURSES__ENABLED in .env, see .env.example}
      APP_COURSES__SOURCE_DIR: ${SOURCES_DIR:?set SOURCES_DIR in .env, see .env.example}
      APP_INGEST__CHUNK_SIZE: ${APP_INGEST__CHUNK_SIZE:?set APP_INGEST__CHUNK_SIZE in .env, see .env.example}
      APP_INGEST__CHUNK_OVERLAP: ${APP_INGEST__CHUNK_OVERLAP:?set APP_INGEST__CHUNK_OVERLAP in .env, see .env.example}
      APP_SEARCH__DEFAULT_K: ${APP_SEARCH__DEFAULT_K:?set APP_SEARCH__DEFAULT_K in .env, see .env.example}
      APP_SEARCH__MAX_K: ${APP_SEARCH__MAX_K:?set APP_SEARCH__MAX_K in .env, see .env.example}
      APP_SEARCH__MIN_SCORE: ${APP_SEARCH__MIN_SCORE:?set APP_SEARCH__MIN_SCORE in .env, see .env.example}
      # The embedding model; the vectors' space is named after it.
      APP_EMBEDDING__MODEL: ${APP_EMBEDDING__MODEL}
      APP_EMBEDDING__REVISION: ${APP_EMBEDDING__REVISION}
      APP_EMBEDDING__DIMENSION: ${APP_EMBEDDING__DIMENSION}
      APP_EMBEDDING__PASSAGE_PREFIX: ${APP_EMBEDDING__PASSAGE_PREFIX}
      APP_EMBEDDING__QUERY_PREFIX: ${APP_EMBEDDING__QUERY_PREFIX}
      # Where the embedding server is and how long one request to it may take.
      APP_EMBEDDING_SERVICE__URL: ${APP_EMBEDDING_SERVICE__URL:?set APP_EMBEDDING_SERVICE__URL in .env, see .env.example}
      APP_EMBEDDING_SERVICE__TIMEOUT_SECONDS: ${APP_EMBEDDING_SERVICE__TIMEOUT_SECONDS:?set APP_EMBEDDING_SERVICE__TIMEOUT_SECONDS in .env, see .env.example}
      # The model that answers questions, and how the app reaches its provider.
      APP_LLM__ANSWER: ${APP_LLM__ANSWER:?set APP_LLM__ANSWER in .env, see .env.example}
      APP_OPENAI__API_KEY: ${APP_OPENAI__API_KEY:?set APP_OPENAI__API_KEY in .env, see .env.example}
      APP_OPENAI__BASE_URL: ${APP_OPENAI__BASE_URL:?set APP_OPENAI__BASE_URL in .env, see .env.example}
      APP_OPENAI__TIMEOUT_SECONDS: ${APP_OPENAI__TIMEOUT_SECONDS:?set APP_OPENAI__TIMEOUT_SECONDS in .env, see .env.example}
      APP_ADMIN__API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env, see .env.example}
    volumes:
      # Course manifests are data, not part of the image; the app only reads them.
      - ./courses:${COURSES_DIR}:ro
      # Course sources: the committed ones (the demo course) are in courses/, next to their manifests ...
      - ./courses:${SOURCES_DIR}:ro
      # ... and one course whose material stays outside the repository, in its own folder on this machine.
      - ${LOCAL_COURSE_SOURCES:?set LOCAL_COURSE_SOURCES in .env, see .env.example}:${SOURCES_DIR}/${LOCAL_COURSE_ID:?set LOCAL_COURSE_ID in .env, see .env.example}:ro
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Starts only after the migration run has finished without an error.
      migrate:
        condition: service_completed_successfully
      # Ingestion needs vectors, so the app starts once the embedding server has loaded its model.
      embedder:
        condition: service_healthy
    healthcheck:
      # The image has no curl; Python's standard library is enough. Healthy means ready, not only alive.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Runs once when the app is ready, then exits: asks the app to ingest every course it serves, so every start of
  # the stack ends with the stored data in line with the course files, also on an empty volume. Unchanged courses
  # cost nothing. It tries every course and exits with 1 if any failed, naming the course in its log.
  # Nothing depends on it, so "up --wait" neither waits for it nor sees it fail; "docker compose wait ingest"
  # after it returns this run's exit code.
  ingest:
    build: *app-build
    command: ["python", "-m", "study_assistant.ingest_courses"]
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL}
      # The app inside the stack, by its service name, and the longest wait for one course's ingestion.
      APP_SERVER__URL: ${APP_SERVER__URL:?set APP_SERVER__URL in .env, see .env.example}
      APP_SERVER__TIMEOUT_SECONDS: ${APP_SERVER__TIMEOUT_SECONDS:?set APP_SERVER__TIMEOUT_SECONDS in .env, see .env.example}
      APP_ADMIN__API_KEY: ${ADMIN_API_KEY}
    depends_on:
      # Starts only when the app answers /ready: the database is reachable and the embedding server has its model.
      app:
        condition: service_healthy

volumes:
  db-data:
