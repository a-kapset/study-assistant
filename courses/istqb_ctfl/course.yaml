# ISTQB Certified Tester Foundation Level (CTFL), syllabus v4.0.1.
# Only this manifest is committed; the syllabus itself stays on the local machine.
id: istqb_ctfl
title: ISTQB Certified Tester Foundation Level (CTFL) v4.0
description: >-
  Preparation for the ISTQB Certified Tester Foundation Level exam: testing fundamentals,
  testing throughout the software development lifecycle, static testing, test analysis and
  design, managing the test activities, and test tools.
language: en

# Regular expressions, applied to the source text line by line.
structure:
  # "1.2. Why is Testing Necessary?", "4.2.1. Equivalence Partitioning". A chapter heading ends with its
  # teaching time ("1. Fundamentals of Testing – 180 minutes"), which is left out of the title. Table of
  # contents lines (a title followed by a row of dots) are not headings.
  section_heading: '^(?P<id>\d+(?:\.\d+){0,2})\.\s+(?!.*\.{4})(?P<title>\S.*?)(?:\s+–\s+\d+\s+minutes)?$'
  # "FL-1.2.3" -> learning objective 3 of section 1.2. Objectives are listed at the start of each chapter,
  # not inside their sections, so the section comes from the id.
  objective_id: 'FL-(?P<section>\d+\.\d+)\.\d+'
  # "(K2)" -> the knowledge level, on the same line as the objective id.
  knowledge_level: '\((?P<level>K[1-3])\)'

# Paths are relative to the course's source directory.
sources:
  - file: ctfl_syllabus_v4.0.1.pdf
    role: material
    authority: primary
    # The four-line running header of every page ("Certified Tester" / "Foundation Level" /
    # "v4.0.1 Page 12 of 78 2024-09-15" / "© International Software Testing Qualifications Board").
    noise_lines:
      - 'Certified Tester'
      - 'Foundation Level'
      - 'v4\.0\.1 Page \d+ of \d+ \d{4}-\d{2}-\d{2}'
      - '© International Software Testing Qualifications Board'
    # Only the teaching text of chapters 1–6 is searched: sections 1.1 and below. The pages before the first
    # heading, the introduction (0.x), the chapter pages that list keywords and objectives, the references,
    # the appendices and the index stay in the document's structure but get no chunks.
    content_sections: '[1-6](\.\d+)+'
  # Stapp, Roman, Pilaeten: ISTQB Certified Tester Foundation Level (Springer, 2024). A primary source: its Part II
  # discusses the syllabus chapter by chapter with the syllabus's own section numbers. Stays on this machine.
  - file: ISTQB_Certified_Tester_Foundation_Level.pdf
    role: material
    authority: primary
    # Running headers ("28 Chapter 1 Fundamentals of Testing", "1.1 What Is Testing? 27"), the bare page number,
    # the copyright footer of a chapter's first page and the "(continued)" mark of split tables.
    noise_lines:
      - '\d+ Chapter \d+ .+'
      - '\d+(\.\d+)+ .+ \d+'
      - '\d+'
      - '© The Author\(s\), under exclusive license to Springer Nature Switzerland AG 2024'
      - 'L\. Stapp et al\., ISTQB® Certified Tester Foundation Level'
      - '\(continued\)'
    # "Chapter 1 Fundamentals of Testing" and "1.1 What Is Testing?": no dot after the number, unlike the syllabus.
    section_heading: '^(?:Chapter )?(?P<id>(?<=Chapter )\d+|\d+\.\d+(?:\.\d+)?) (?P<title>[A-Z].*)$'
    # Part II only, without the sample questions and exercises at the end of each chapter: Part III holds the
    # answers, and Part IV reprints the official sample exam, whose questions are the questions this course's
    # retrieval is measured with.
    pages: [[36, 79], [85, 139], [143, 174], [179, 246], [260, 304], [315, 317]]
    # The teaching sections only; a chapter's first pages hold its keywords and objectives.
    content_sections: '[1-6](\.\d+)+'
  # Written by tools/convert_sample_exams.py from the four sample exam sets (questions and answers PDFs);
  # stays on this machine like the other sources.
  - file: sample_exams_bank.jsonl
    role: question_bank
    authority: primary
